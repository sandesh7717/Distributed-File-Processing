services:
  integration:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      DATABASE_URL: postgres://sde_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/sales_db?sslmode=disable
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: ${MINIO_USER:-dfsadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set MINIO_PASSWORD}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:29092
      BASE_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
